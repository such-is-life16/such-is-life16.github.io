<!DOCTYPE html>
<html>
  <body>
    <canvas id="game" width="640" height="480"></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      // ---------- VIEWPORT ----------
      const VIEW_W = 640;
      const VIEW_H = 480;
      canvas.width = VIEW_W;
      canvas.height = VIEW_H;

      // ---------- CONSTANTS ----------
      const TILE = 32;
      const STEP = TILE / 6;
      const SCALE = 0.10;
      const ZOOM = 1.5;

      // ---------- PLAYER SPRITE GRID ----------
      const PLAYER_COLS = 3;
      const PLAYER_ROWS = 4;

      // ---------- NPC SPRITE GRID ----------
      const NPC_COLS = 3;   // frames across
      const NPC_ROWS = 3;   // actual rows in image
      const NPC_IDLE_ROW = 0; // FRONT FACING ROW
      const NPC_IDLE_FRAMES = [1, 2]; // sway only

      // ---------- AUDIO ----------
      const music = new Audio("music2.mp3");
      music.loop = true;
      music.volume = 0.3;
      let musicStarted = false;

      // ---------- PLAYER STATE ----------
      let x = 10 * TILE;
      let y = 6 * TILE;
      let dir = 0;
      let frame = 0;
      let FRAME_W, FRAME_H;

      // ---------- NPC STATE ----------
      let NPC_FRAME_W, NPC_FRAME_H;
      let npcFrameIndex = 0;
      let npcTimer = 0;

      const npcX = 14 * TILE;
      const npcY = 8 * TILE;

      // ---------- IMAGES ----------
      const mapImg = new Image();
      mapImg.src = "map.png";

      const player = new Image();
      player.src = "player.png";

      const npc = new Image();
      npc.src = "npc.png";

      // ---------- LOAD SPRITES ----------
      player.onload = () => {
        FRAME_W = player.width / PLAYER_COLS;
        FRAME_H = player.height / PLAYER_ROWS;
      };

      npc.onload = () => {
        NPC_FRAME_W = npc.width / NPC_COLS;
        NPC_FRAME_H = npc.height / NPC_ROWS;
      };

      // ---------- NPC ANIMATION ----------
      function updateNPC() {
        npcTimer++;
        if (npcTimer > 80) { // calm idle sway
          npcFrameIndex = (npcFrameIndex + 1) % NPC_IDLE_FRAMES.length;
          npcTimer = 0;
        }
      }

      // ---------- PLAYER STEP ----------
      function step() {
        if (dir === 0) y += STEP;
        if (dir === 1) x -= STEP;
        if (dir === 2) x += STEP;
        if (dir === 3) y -= STEP;
        frame = frame === 0 ? 1 : 0;
      }

      // ---------- INPUT ----------
      document.addEventListener("keydown", (e) => {
        if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
          e.preventDefault();
        }

        if (!musicStarted) {
          music.play();
          musicStarted = true;
        }

        if (e.key === "ArrowDown")  { dir = 0; step(); }
        if (e.key === "ArrowLeft")  { dir = 1; step(); }
        if (e.key === "ArrowRight") { dir = 2; step(); }
        if (e.key === "ArrowUp")    { dir = 3; step(); }
      });

      // ---------- DRAW ----------
      function draw() {
        if (!mapImg.complete || !FRAME_W || !NPC_FRAME_W) return;

        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,VIEW_W,VIEW_H);
        ctx.scale(ZOOM, ZOOM);

        const viewW = VIEW_W / ZOOM;
        const viewH = VIEW_H / ZOOM;

        let camX = x - viewW / 2;
        let camY = y - viewH / 2;

        camX = Math.max(0, Math.min(camX, mapImg.width - viewW));
        camY = Math.max(0, Math.min(camY, mapImg.height - viewH));

        // ----- MAP -----
        ctx.drawImage(mapImg, -camX, -camY);

        // ----- NPC (Dr K) -----
        const npcCol = NPC_IDLE_FRAMES[npcFrameIndex];
        const nw = NPC_FRAME_W * SCALE;
        const nh = NPC_FRAME_H * SCALE;

        ctx.drawImage(
          npc,
          npcCol * NPC_FRAME_W,
          NPC_IDLE_ROW * NPC_FRAME_H,
          NPC_FRAME_W,
          NPC_FRAME_H,
          npcX - camX,
          npcY - camY,
          nw,
          nh
        );

        // ----- PLAYER -----
        const pw = FRAME_W * SCALE;
        const ph = FRAME_H * SCALE;

        ctx.drawImage(
          player,
          frame * FRAME_W,
          dir * FRAME_H,
          FRAME_W,
          FRAME_H,
          x - camX,
          y - camY,
          pw,
          ph
        );
      }

      // ---------- GAME LOOP ----------
      function loop() {
        updateNPC();
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    </script>
  </body>
</html>
