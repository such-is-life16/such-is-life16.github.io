<!DOCTYPE html>
<html>
  <body>
    <canvas id="game" width="640" height="480"></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      // ---------- VIEWPORT ----------
      const VIEW_W = 640;
      const VIEW_H = 480;
      canvas.width = VIEW_W;
      canvas.height = VIEW_H;

      // ---------- CONSTANTS ----------
      const COLS = 3;
      const ROWS = 4;
      const TILE = 32;
      const STEP = TILE / 6;
      const SCALE = 0.10;
      const ZOOM = 1.5;

      // ---------- AUDIO ----------
      const music = new Audio("music2.mp3");
      music.loop = true;
      music.volume = 0.3;
      let musicStarted = false;

      // ---------- PLAYER STATE ----------
      let x = 10 * TILE;
      let y = 6 * TILE;
      let dir = 0;
      let frame = 0;
      let FRAME_W, FRAME_H;

      // ---------- IMAGES ----------
      const mapImg = new Image();
      mapImg.src = "map.png";

      const player = new Image();
      player.src = "player.png";

      // ---------- NPC (Dr K) ----------
      const NPC_COLS = 3;
      const NPC_ROWS = 1;

      let NPC_FRAME_W, NPC_FRAME_H;
      let npcFrame = 0;
      let npcTimer = 0;

      const npc = new Image();
      npc.src = "npc.png";
      npc.onload = () => {
        NPC_FRAME_W = npc.width / NPC_COLS;
        NPC_FRAME_H = npc.height / NPC_ROWS;
      };

      const npcX = 14 * TILE;
      const npcY = 8 * TILE;

      // ---------- LOAD PLAYER ----------
      player.onload = () => {
        FRAME_W = player.width / COLS;
        FRAME_H = player.height / ROWS;
      };

      // ---------- NPC ANIMATION ----------
      function updateNPC() {
        npcTimer++;
        if (npcTimer > 40) {
          npcFrame = (npcFrame + 1) % NPC_COLS;
          npcTimer = 0;
        }
      }

      // ---------- PLAYER STEP ----------
      function step() {
        if (dir === 0) y += STEP;
        if (dir === 1) x -= STEP;
        if (dir === 2) x += STEP;
        if (dir === 3) y -= STEP;
        frame = frame === 0 ? 1 : 0;
      }

      // ---------- INPUT ----------
      document.addEventListener("keydown", (e) => {
        if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
          e.preventDefault();
        }

        if (!musicStarted) {
          music.play();
          musicStarted = true;
        }

        let moved = false;
        if (e.key === "ArrowDown")  { dir = 0; moved = true; }
        if (e.key === "ArrowLeft")  { dir = 1; moved = true; }
        if (e.key === "ArrowRight") { dir = 2; moved = true; }
        if (e.key === "ArrowUp")    { dir = 3; moved = true; }

        if (moved) step();
      });

      // ---------- DRAW ----------
      function draw() {
        if (!mapImg.complete || !FRAME_W) return;

        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,VIEW_W,VIEW_H);
        ctx.scale(ZOOM, ZOOM);

        const viewW = VIEW_W / ZOOM;
        const viewH = VIEW_H / ZOOM;

        let camX = x - viewW / 2;
        let camY = y - viewH / 2;

        camX = Math.max(0, Math.min(camX, mapImg.width - viewW));
        camY = Math.max(0, Math.min(camY, mapImg.height - viewH));

        ctx.drawImage(mapImg, -camX, -camY);

        // ----- DRAW NPC -----
        if (npc.complete && NPC_FRAME_W) {
          const nw = NPC_FRAME_W * SCALE;
          const nh = NPC_FRAME_H * SCALE;

          ctx.drawImage(
            npc,
            npcFrame * NPC_FRAME_W,
            0,
            NPC_FRAME_W,
            NPC_FRAME_H,
            npcX - camX,
            npcY - camY,
            nw,
            nh
          );
        }

        // ----- DRAW PLAYER -----
        const w = FRAME_W * SCALE;
        const h = FRAME_H * SCALE;

        ctx.drawImage(
          player,
          frame * FRAME_W,
          dir * FRAME_H,
          FRAME_W,
          FRAME_H,
          x - camX,
          y - camY,
          w,
          h
        );
      }

      // ---------- GAME LOOP ----------
      function loop() {
        updateNPC();
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    </script>
  </body>
</html>
