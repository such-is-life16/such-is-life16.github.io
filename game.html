<!DOCTYPE html>
<html>
  <body>
    <canvas id="game" width="640" height="480"></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      // ---------- VIEWPORT ----------
      const VIEW_W = 640;
      const VIEW_H = 480;
      canvas.width = VIEW_W;
      canvas.height = VIEW_H;

      // ---------- CONSTANTS ----------
      const COLS = 3;
      const ROWS = 4;
      const TILE = 32;
      const STEP = TILE / 6;
      const SCALE = 0.10;
      const ZOOM = 1.5;

      // ---------- AUDIO ----------
      const music = new Audio("music.mp3");
      music.loop = true;
      music.volume = 0.3;
      let musicStarted = false;

      // ---------- STATE ----------
      let x = 10 * TILE;
      let y = 6 * TILE;
      let dir = 0;
      let frame = 0;
      let FRAME_W, FRAME_H;

      // ---------- IMAGES ----------
      const mapImg = new Image();
      mapImg.src = "map.png";

      const sprite = new Image();
      sprite.src = "player.png";

      // ---------- NPC (Dr K) ----------
const npc = new Image();
npc.src = "npc.png";
npc.onload = () => {
  console.log("NPC LOADED", npc.width, npc.height);
  NPC_FRAME_W = npc.width / NPC_COLS;
  NPC_FRAME_H = npc.height / NPC_ROWS;
};


const NPC_COLS = 3;
const NPC_ROWS = 1;

let NPC_FRAME_W, NPC_FRAME_H;
let npcFrame = 0;
let npcTimer = 0;

// fixed world position (pick something nice)
const npcX = 14 * TILE;
const npcY = 8 * TILE;


      mapImg.onload = draw;

      sprite.onload = () => {
        FRAME_W = sprite.width / COLS;
        FRAME_H = sprite.height / ROWS;
        draw();
      };
      npc.onload = () => {
  NPC_FRAME_W = npc.width / NPC_COLS;
  NPC_FRAME_H = npc.height / NPC_ROWS;
};


      // ---------- STEP ----------
      function updateNPC() {
  npcTimer++;
  if (npcTimer > 20) {
    npcFrame = (npcFrame + 1) % 3; // 0 → 1 → 2
    npcTimer = 0;
  }
}

      function step() {
        if (dir === 0) y += STEP;
        if (dir === 1) x -= STEP;
        if (dir === 2) x += STEP;
        if (dir === 3) y -= STEP;
        frame = frame === 0 ? 1 : 0;
      }

      // ---------- INPUT ----------
      document.addEventListener("keydown", (e) => {
        if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
          e.preventDefault();
        }

        if (!musicStarted) {
          music.play();
          musicStarted = true;
        }

        let moved = false;

        if (e.key === "ArrowDown")  { dir = 0; moved = true; }
        if (e.key === "ArrowLeft")  { dir = 1; moved = true; }
        if (e.key === "ArrowRight") { dir = 2; moved = true; }
        if (e.key === "ArrowUp")    { dir = 3; moved = true; }

        if (moved) {
          step();
          draw();
        }
      });

      // ---------- DRAW ----------
      function draw() {
        if (!mapImg.complete || !FRAME_W) return;

        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,VIEW_W,VIEW_H);
        ctx.scale(ZOOM, ZOOM);

        const viewW = VIEW_W / ZOOM;
        const viewH = VIEW_H / ZOOM;

        let camX = x - viewW / 2;
        let camY = y - viewH / 2;

        camX = Math.max(0, Math.min(camX, mapImg.width - viewW));
        camY = Math.max(0, Math.min(camY, mapImg.height - viewH));

        ctx.drawImage(mapImg, -camX, -camY);
        // ---------- DRAW NPC ----------
if (npc.complete && NPC_FRAME_W) {
  updateNPC();

  const nw = NPC_FRAME_W * SCALE;
  const nh = NPC_FRAME_H * SCALE;

  const nx = npcX - camX;
  const ny = npcY - camY;

  ctx.drawImage(
    npc,
    npcFrame * NPC_FRAME_W, // columns 0–1–2
    0,                      // row 0 only
    NPC_FRAME_W,
    NPC_FRAME_H,
    nx,
    ny,
    nw,
    nh
  );
}


        const w = FRAME_W * SCALE;
        const h = FRAME_H * SCALE;
        const drawX = x - camX;
        const drawY = y - camY;

        ctx.save();

        if (dir === 1 || dir === 2) {
          const col = frame;
          if (dir === 1) {
            ctx.translate(drawX + w, drawY);
            ctx.scale(-1,1);
            ctx.drawImage(sprite, col*FRAME_W, FRAME_H, FRAME_W, FRAME_H, 0,0,w,h);
          } else {
            ctx.drawImage(sprite, col*FRAME_W, FRAME_H, FRAME_W, FRAME_H, drawX,drawY,w,h);
          }
        } else {
          const col = frame === 0 ? 1 : 2;
          ctx.drawImage(sprite, col*FRAME_W, (dir===0?0:3)*FRAME_H, FRAME_W, FRAME_H, drawX,drawY,w,h);
        }

        ctx.restore();
      }
    </script>
  </body>
</html>
